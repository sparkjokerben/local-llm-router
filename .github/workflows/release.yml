name: 发布发行版

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装前端依赖
        working-directory: ui
        run: npm ci

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建并签名 NSIS 安装版
        working-directory: crates/app
        env:
          # 更新签名私钥（生成后无法找回，丢失将无法发布更新）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: tauri build --bundles nsis

      - name: 生成更新清单 latest.json
        shell: pwsh
        run: |
          $bundleDir = "${{ github.workspace }}/target/release/bundle/nsis"
          $exe = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $cfg = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          $manifest = @{
            version = $cfg.version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/sparkjokerben/local-llm-router/releases/download/$tag/$([uri]::EscapeDataString($exe.Name))"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "${{ github.workspace }}/target/release/bundle/latest.json"
          Write-Host "latest.json:"
          Get-Content "${{ github.workspace }}/target/release/bundle/latest.json"

      - name: 打包绿色版（免安装 zip）
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/target/release/llm-router-app.exe" `
            -DestinationPath "${{ github.workspace }}/LLM-Router-portable-win-x64.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            ${{ github.workspace }}/target/release/bundle/nsis/*-setup.exe
            ${{ github.workspace }}/target/release/bundle/nsis/*.sig
            ${{ github.workspace }}/target/release/bundle/latest.json
            ${{ github.workspace }}/LLM-Router-portable-win-x64.zip
          if-no-files-found: error

      - name: 创建 GitHub Release（打 tag 时触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/target/release/bundle/nsis/*-setup.exe
            ${{ github.workspace }}/target/release/bundle/nsis/*.sig
            ${{ github.workspace }}/target/release/bundle/latest.json
            ${{ github.workspace }}/LLM-Router-portable-win-x64.zip
          generate_release_notes: true
