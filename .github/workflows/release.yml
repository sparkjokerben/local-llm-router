name: 发布发行版

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装前端依赖
        working-directory: ui
        run: npm ci

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建并签名 NSIS 安装版
        working-directory: crates/app
        env:
          # 更新签名私钥（生成后无法找回，丢失将无法发布更新）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: tauri build --bundles nsis

      - name: 规范化产物文件名（GitHub 上传资产会把空格换成点，统一无空格）
        shell: pwsh
        run: |
          $bundleDir = "${{ github.workspace }}/target/release/bundle/nsis"
          $cfg = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          $exe = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          $canon = "LLM-Router_$($cfg.version)-x64-setup.exe"
          if ($exe.Name -ne $canon) {
            $sig = Get-ChildItem "$($exe.FullName).sig" -ErrorAction SilentlyContinue
            Rename-Item $exe.FullName $canon
            if ($sig) { Rename-Item $sig.FullName "$canon.sig" }
          }

      - name: 生成更新清单 latest.json（直连 raw.githubusercontent.com 可访问）
        shell: pwsh
        run: |
          $bundleDir = "${{ github.workspace }}/target/release/bundle/nsis"
          $cfg = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          $exe = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $manifest = @{
            version = $cfg.version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://raw.githubusercontent.com/sparkjokerben/local-llm-router/main/updates/$($exe.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "${{ github.workspace }}/target/release/bundle/latest.json"
          Write-Host "latest.json:"
          Get-Content "${{ github.workspace }}/target/release/bundle/latest.json"

      - name: 同步更新文件到仓库 updates/（应用内更新直连来源）
        shell: pwsh
        run: |
          $bundleDir = "${{ github.workspace }}/target/release/bundle/nsis"
          $cfg = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path "updates" | Out-Null
          Get-ChildItem "$bundleDir/*-setup.exe" | Copy-Item -Destination "updates/" -Force
          Get-ChildItem "$bundleDir/*.sig" | Copy-Item -Destination "updates/" -Force
          Copy-Item "${{ github.workspace }}/target/release/bundle/latest.json" "updates/latest.json" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag 触发是游离 HEAD：先同步到远端最新 main，再提交避免非快进冲突
          git fetch origin main
          git reset --hard origin/main
          git add updates/
          git commit -m "chore(updates): 发布 $($cfg.version) 更新文件" --quiet || echo "updates 无变化"
          git push origin HEAD:main
          Write-Host "updates/ 已同步："
          Get-ChildItem "updates" | Select-Object Name, Length

      - name: 打包绿色版（免安装 zip）
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/target/release/llm-router-app.exe" `
            -DestinationPath "${{ github.workspace }}/LLM-Router-portable-win-x64.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            ${{ github.workspace }}/target/release/bundle/nsis/*-setup.exe
            ${{ github.workspace }}/target/release/bundle/nsis/*.sig
            ${{ github.workspace }}/target/release/bundle/latest.json
            ${{ github.workspace }}/LLM-Router-portable-win-x64.zip
          if-no-files-found: error

      - name: 创建 GitHub Release（打 tag 时触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/target/release/bundle/nsis/*-setup.exe
            ${{ github.workspace }}/target/release/bundle/nsis/*.sig
            ${{ github.workspace }}/target/release/bundle/latest.json
            ${{ github.workspace }}/LLM-Router-portable-win-x64.zip
          generate_release_notes: true
