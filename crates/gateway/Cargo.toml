[package]
name = "gateway"
version.workspace = true
edition.workspace = true
description = "Local LLM routing gateway for Claude Code"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
subtle = "2"
dirs = "5"
url = "2"
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
